app = 'altbloc-settlement-prod'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  SETTLEMENT_API_URL = 'https://altbloc-backend-prod.fly.dev'
  SETTLEMENT_LIVE = 'true'
  ALLOW_MAINNET_LIVE = 'true'
  SETTLEMENT_POLL_MS = '3000'
  SETTLEMENT_POLL_LIMIT = '50'
  SETTLEMENT_ONCE = 'false'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1